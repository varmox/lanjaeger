name: Appliance

# Builds the Photon OS 5 OVA, boots it in QEMU with deployment options and
# checks the stack works. Tags (v*) also publish the OVA as a release asset.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - appliance/**
      - docker-compose.yml
      - .env.example
      - blocky/**
      - monitoring/**
      - webui/**
      - .github/workflows/appliance.yml
  pull_request:
    paths:
      - appliance/**
      - .github/workflows/appliance.yml
  workflow_dispatch:
  # Monthly rebuild: Photon OS security updates and the newest lancache
  # images, published as the rolling "appliance-latest" pre-release.
  schedule:
    - cron: "37 3 1 * *"

permissions:
  contents: write

jobs:
  ova:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the OVA
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION=${GITHUB_REF_NAME#v}
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then export VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}
          else export VERSION=0.0.0-${GITHUB_SHA::7}; fi
          appliance/build.sh
          ls -l appliance/out

      - name: Check the OVF descriptor
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils >/dev/null
          ova=$(ls appliance/out/*.ova)
          tar -tvf "$ova"
          tar -xOf "$ova" --wildcards '*.ovf' > lanjaeger.ovf
          xmllint --noout lanjaeger.ovf
          test "$(grep -c 'ovf:userConfigurable="true"' lanjaeger.ovf)" -ge 18
          grep -q 'ovf:id="small"' lanjaeger.ovf && grep -q 'ovf:id="large"' lanjaeger.ovf
          grep -q 'com.vmware.guestInfo' lanjaeger.ovf

      - name: Boot test (QEMU)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage sshpass dnsutils >/dev/null
          sudo chmod a+r appliance/out/work/lanjaeger-root.img
          appliance/test-boot.sh appliance/out/work/lanjaeger-root.img

      - uses: actions/upload-artifact@v7
        with:
          name: lanjaeger-ova
          path: |
            appliance/out/*.ova
            appliance/out/*.sha256
          compression-level: 0
          retention-days: 14

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" appliance/out/*.ova appliance/out/*.sha256 --clobber

      - name: Rolling pre-release (monthly build)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete appliance-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create appliance-latest --prerelease --target "$GITHUB_SHA" \
            --title "Appliance: latest monthly build ($(date -u +%Y-%m-%d))" \
            --notes "Monthly rebuild of the lanjaeger appliance from main, with current Photon OS 5 updates and container images. For production, prefer a numbered release." \
            appliance/out/*.ova appliance/out/*.sha256
