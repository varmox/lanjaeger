name: ng update (temporary)
# One-off helper for the Angular 22 upgrade branch: runs the official
# migrations and uploads the diff. Removed again before merging.
on:
  push:
    branches: [angular-22]
    paths: [.github/workflows/ng-update.yml]
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: ng update
        working-directory: webui/frontend
        run: |
          npm ci --no-audit --no-fund
          git config user.email ci@example.invalid && git config user.name ci
          npx ng version
          npx ng update @angular/core@22.2.6 @angular/cli@22.2.7 --allow-dirty 2>&1 | tee ../../ng-update.log
          npx ng update @angular/cdk@22.2.7 --allow-dirty 2>&1 | tee -a ../../ng-update.log
      - name: Diff
        run: |
          git add -A -- webui/frontend
          git diff --cached --stat
          git diff --cached > ng-update.patch
      - uses: actions/upload-artifact@v5
        with:
          name: ng-update
          path: |
            ng-update.patch
            ng-update.log
