name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly run on main: lancache's images are on :latest and upstream lists
  # change, so things can break without a commit here. Failures open an issue.
  schedule:
    - cron: "23 6 * * 0"        # Sundays

permissions:
  contents: read
  issues: write

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts
        run: shellcheck update.sh scripts/rotate-logs.sh appliance/build.sh appliance/test-boot.sh

      - name: Compose file (with and without the web UI, and with IPv6 DNS)
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=webui docker compose config --quiet
          COMPOSE_PROFILES=webui,monitoring docker compose config --quiet
          DNS_BIND_IP6=fd00::10 docker compose -f docker-compose.yml -f docker-compose.ipv6.yml config --quiet

      - name: Blocky config
        run: |
          docker run --rm -v "$PWD/blocky:/app/cfg:ro" --entrypoint /app/blocky \
            ghcr.io/0xerr0r/blocky:v0.35.0 validate --config /app/cfg/config.yml

      - name: Log rotation
        run: |
          mkdir -p /tmp/logs
          head -c 3145728 /dev/zero > /tmp/logs/access.log   # 3 MB
          docker run --rm -v /tmp/logs:/logs -v "$PWD/scripts/rotate-logs.sh:/r.sh:ro" \
            -e LOG_MAX_SIZE_MB=1 -e LOG_KEEP=2 busybox:1.36 \
            sh -c 'timeout 5 sh /r.sh || true'
          test "$(stat -c %s /tmp/logs/access.log)" -eq 0
          test -f /tmp/logs/access.log.1.gz

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: webui/server
        run: python -m unittest discover -s tests -t . -v

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Frontend build
        working-directory: webui/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build

      - name: Upload build + lockfile
        uses: actions/upload-artifact@v5
        with:
          name: frontend
          path: |
            webui/frontend/dist
            webui/frontend/package-lock.json

      - name: Image
        run: docker build -t lanjaeger-webui:ci webui

      - name: Smoke test
        run: |
          mkdir -p /tmp/lj/logs /tmp/lj/cache && printf 'CACHE_DISK_SIZE=100g\n' > /tmp/lj/.env
          docker run -d --name lj -p 18080:8080 -e WEBUI_PASSWORD=ci -e PROJECT_DIR=/tmp/lj \
            -v /tmp/lj:/tmp/lj -v /tmp/lj/logs:/data/logs:ro -v /tmp/lj/cache:/data/cache:ro lanjaeger-webui:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/session && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<lj-root>'
          docker logs lj

  # The real DNS path: Blocky → lancache-dns, plus the web UI's check zone
  # and DNS entries. (Monolithic is left out: the runner can't spare 80/443.)
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start blocky, lancache-dns, the web UI and monitoring
        run: |
          cp .env.example .env
          sed -i -e 's/^LANCACHE_IP=.*/LANCACHE_IP=192.168.1.10/' -e 's/^DNS_BIND_IP=.*/DNS_BIND_IP=127.0.0.1/' \
                 -e 's/^WEBUI_PASSWORD=.*/WEBUI_PASSWORD=ci/' -e 's/^WEBUI_PORT=.*/WEBUI_PORT=18080/' \
                 -e 's/^#COMPOSE_PROFILES=webui/COMPOSE_PROFILES=webui,monitoring/' \
                 -e 's/^METRICS_TOKEN=.*/METRICS_TOKEN=ci-token/' -e 's/^GRAFANA_PUBLIC=.*/GRAFANA_PUBLIC=true/' \
                 -e "s/^DOCKER_GID=.*/DOCKER_GID=$(stat -c %g /var/run/docker.sock)/" .env
          docker compose up -d --build blocky dns webui telegraf prometheus grafana
          for i in $(seq 1 90); do
            dig +short +time=1 +tries=1 @127.0.0.1 lancache.steamcontent.com | grep -qx 192.168.1.10 && break; sleep 2
          done

      - name: Game domains resolve to the cache
        run: |
          # lancache-dns answers with a CNAME chain ending in LANCACHE_IP
          dig +short @127.0.0.1 lancache.steamcontent.com | tee /dev/stderr | grep -qx 192.168.1.10
          dig +short @127.0.0.1 github.com | grep -q .     # everything else is forwarded

      - name: Client check (DNS responder via Blocky's conditional zone)
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/session >/dev/null && break; sleep 2; done
          start=$(curl -fsS -X POST -H 'X-Lanjaeger: 1' http://127.0.0.1:18080/api/check/start)
          id=$(echo "$start" | jq -r .id)
          for h in $(echo "$start" | jq -r '.hosts[]'); do
            dig +short @127.0.0.1 "$h" | grep -qx 127.0.0.1      # answered with the web UI's address
          done
          curl -fsS "http://127.0.0.1:18080/api/check/result/$id" | tee /dev/stderr | jq -e '.seen == .total'

      - name: DNS entries apply without restarting DNS
        run: |
          curl -fsS -c jar -X POST -H 'X-Lanjaeger: 1' -H 'Content-Type: application/json' \
            -d '{"password":"ci"}' http://127.0.0.1:18080/api/login
          curl -fsS -b jar -X PUT -H 'X-Lanjaeger: 1' -H 'Content-Type: application/json' \
            -d '{"entries":[{"name":"nas.lan","ip":"192.168.1.20","note":"ci"}]}' http://127.0.0.1:18080/api/dns/entries
          for i in $(seq 1 50); do
            dig +short @127.0.0.1 nas.lan | grep -qx 192.168.1.20 && exit 0; sleep 3
          done
          echo "nas.lan never resolved"; exit 1

      - name: Metrics endpoint
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/metrics)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer nope' http://127.0.0.1:18080/metrics)" = 401
          # Some cache traffic for the counters: two clients, hits and a miss.
          for i in $(seq 1 12); do
            now=$(date -u +%d/%b/%Y:%H:%M:%S)
            for c in "10.0.0.5 HIT" "10.0.0.6 HIT" "10.0.0.6 MISS"; do
              set -- $c
              echo "[steam] $1 / - - - [$now +0000] \"GET /depot/1/chunk/$i HTTP/1.1\" 200 52428800 \"-\" \"Valve/Steam HTTP Client 1.0\" \"$2\" \"lancache.steamcontent.com\" \"-\"" \
                | sudo tee -a lancache/logs/access.log >/dev/null
            done
            sleep 5
          done
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/metrics > metrics.txt
          grep -E '^(lanjaeger_up|lanjaeger_dns_up|lanjaeger_clients_seen|lanjaeger_bytes_sent_to_clients_total|blocky_blocking_enabled) ' metrics.txt
          grep -q '^lanjaeger_container_healthy{service="dns"} 1' metrics.txt
          grep -q '^lanjaeger_client_bytes_total{client="10.0.0.6",status="miss"}' metrics.txt
          grep -q '^lanjaeger_prefill_logged_in{service="battlenet"} 1' metrics.txt

      - name: Telegraf → Prometheus → Grafana
        run: |
          q() { curl -fsS http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$1" | jq -r '.data.result | length'; }
          for i in $(seq 1 30); do [ "$(q 'lanjaeger_up')" -gt 0 ] && [ "$(q 'docker_container_cpu_usage_percent')" -gt 0 ] && break; sleep 5; done
          for m in lanjaeger_up lanjaeger_clients_seen 'lanjaeger_service_bytes_total{status="hit"}' blocky_response_total \
                   net_bytes_recv cpu_usage_idle docker_container_mem_usage; do
            echo "$m: $(q "$m") series"; [ "$(q "$m")" -gt 0 ]
          done
          python3 .github/scripts/check-dashboard-metrics.py monitoring/grafana/dashboards/lanjaeger.json http://127.0.0.1:9090 \
            lanjaeger_prefill_last_run_success lanjaeger_prefill_game_timestamp_seconds
          curl -fsS -u admin:ci http://127.0.0.1:3000/api/datasources/uid/lanjaeger-prometheus/health | tee /dev/stderr | jq -e '.status == "OK"'
          curl -fsS -u admin:ci http://127.0.0.1:3000/api/dashboards/uid/lanjaeger | jq -e '.dashboard.panels | length > 20'

      - name: Dashboard screenshot
        run: |
          sleep 60   # a few more data points
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1600,4200 \
            --virtual-time-budget=20000 --screenshot=dashboard.png \
            'http://127.0.0.1:3000/d/lanjaeger/lanjaeger?orgId=1&from=now-15m&to=now&kiosk' || true
          ls -l dashboard.png

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: monitoring
          path: |
            dashboard.png
            metrics.txt

      - name: No per-query logging (privacy)
        run: |
          ! docker compose logs blocky | grep -q 'queryLog: query resolved'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80

  report:
    needs: [stack, webui, integration]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update an issue
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Weekly CI run failed"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Failed again: $run"
          else
            gh label create maintenance -R "$GITHUB_REPOSITORY" --color fbca04 2>/dev/null || true
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label maintenance --body \
              "The scheduled CI run on main failed: $run. Most likely an upstream image (lancache on :latest) or list changed."
          fi
