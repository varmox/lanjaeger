name: CI

on:
  push:
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts
        run: shellcheck update.sh scripts/rotate-logs.sh

      - name: Compose file (with and without the web UI, and with IPv6 DNS)
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=webui docker compose config --quiet
          DNS_BIND_IP6=fd00::10 docker compose -f docker-compose.yml -f docker-compose.ipv6.yml config --quiet

      - name: Blocky config
        run: |
          docker run --rm -v "$PWD/blocky:/app/cfg:ro" --entrypoint /app/blocky \
            ghcr.io/0xerr0r/blocky:v0.35.0 validate --config /app/cfg/config.yml

      - name: Log rotation
        run: |
          mkdir -p /tmp/logs
          head -c 3145728 /dev/zero > /tmp/logs/access.log   # 3 MB
          docker run --rm -v /tmp/logs:/logs -v "$PWD/scripts/rotate-logs.sh:/r.sh:ro" \
            -e LOG_MAX_SIZE_MB=1 -e LOG_KEEP=2 busybox:1.36 \
            sh -c 'timeout 5 sh /r.sh || true'
          test "$(stat -c %s /tmp/logs/access.log)" -eq 0
          test -f /tmp/logs/access.log.1.gz

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: webui/server
        run: python -m unittest discover -s tests -t . -v

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Frontend build
        working-directory: webui/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build

      - name: Upload build + lockfile
        uses: actions/upload-artifact@v5
        with:
          name: frontend
          path: |
            webui/frontend/dist
            webui/frontend/package-lock.json

      - name: Image
        run: docker build -t lanjaeger-webui:ci webui

      - name: Smoke test
        run: |
          mkdir -p /tmp/lj/logs /tmp/lj/cache && printf 'CACHE_DISK_SIZE=100g\n' > /tmp/lj/.env
          docker run -d --name lj -p 18080:8080 -e WEBUI_PASSWORD=ci -e PROJECT_DIR=/tmp/lj \
            -v /tmp/lj:/tmp/lj -v /tmp/lj/logs:/data/logs:ro -v /tmp/lj/cache:/data/cache:ro lanjaeger-webui:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/api/session && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<lj-root>'
          docker logs lj

  # The real DNS path: Blocky → lancache-dns, plus the web UI's check zone
  # and DNS entries. (Monolithic is left out: the runner can't spare 80/443.)
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start blocky, lancache-dns and the web UI
        run: |
          cp .env.example .env
          sed -i -e 's/^LANCACHE_IP=.*/LANCACHE_IP=192.168.1.10/' -e 's/^DNS_BIND_IP=.*/DNS_BIND_IP=127.0.0.1/' \
                 -e 's/^WEBUI_PASSWORD=.*/WEBUI_PASSWORD=ci/' -e 's/^WEBUI_PORT=.*/WEBUI_PORT=18080/' \
                 -e 's/^#COMPOSE_PROFILES=webui/COMPOSE_PROFILES=webui/' .env
          docker compose up -d --build blocky dns webui
          for i in $(seq 1 90); do
            dig +short +time=1 +tries=1 @127.0.0.1 lancache.steamcontent.com | grep -qx 192.168.1.10 && break; sleep 2
          done

      - name: Game domains resolve to the cache
        run: |
          # lancache-dns answers with a CNAME chain ending in LANCACHE_IP
          dig +short @127.0.0.1 lancache.steamcontent.com | tee /dev/stderr | grep -qx 192.168.1.10
          dig +short @127.0.0.1 github.com | grep -q .     # everything else is forwarded

      - name: Client check (DNS responder via Blocky's conditional zone)
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/session >/dev/null && break; sleep 2; done
          start=$(curl -fsS -X POST -H 'X-Lanjaeger: 1' http://127.0.0.1:18080/api/check/start)
          id=$(echo "$start" | jq -r .id)
          for h in $(echo "$start" | jq -r '.hosts[]'); do
            dig +short @127.0.0.1 "$h" | grep -qx 127.0.0.1      # answered with the web UI's address
          done
          curl -fsS "http://127.0.0.1:18080/api/check/result/$id" | tee /dev/stderr | jq -e '.seen == .total'

      - name: DNS entries apply without restarting DNS
        run: |
          curl -fsS -c jar -X POST -H 'X-Lanjaeger: 1' -H 'Content-Type: application/json' \
            -d '{"password":"ci"}' http://127.0.0.1:18080/api/login
          curl -fsS -b jar -X PUT -H 'X-Lanjaeger: 1' -H 'Content-Type: application/json' \
            -d '{"entries":[{"name":"nas.lan","ip":"192.168.1.20","note":"ci"}]}' http://127.0.0.1:18080/api/dns/entries
          for i in $(seq 1 50); do
            dig +short @127.0.0.1 nas.lan | grep -qx 192.168.1.20 && exit 0; sleep 3
          done
          echo "nas.lan never resolved"; exit 1

      - name: No per-query logging (privacy)
        run: |
          ! docker compose logs blocky | grep -q 'queryLog: query resolved'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
