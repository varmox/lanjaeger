# lanjaeger's own metrics: cache traffic, clients, containers' health,
# prefilled games, disk, DNS/ad blocking. Served by the web UI at /metrics.
#
# Needs two environment variables:
#   LANJAEGER_METRICS_URL  e.g. http://192.168.10.10:8080/metrics
#   METRICS_TOKEN          the same value as METRICS_TOKEN in lanjaeger's .env
# (the monitoring container gets both from docker-compose.yml; for a Telegraf
# on the host put them in /etc/default/telegraf).

[[inputs.prometheus]]
  urls = ["${LANJAEGER_METRICS_URL}"]
  bearer_token_string = "${METRICS_TOKEN}"
  metric_version = 2
  timeout = "10s"
  # For VCF Operations: leave out the per-client, per-game and histogram
  # series (they'd become hundreds of metrics there). Uncomment there only;
  # Grafana uses them.
  # fieldexclude = ["lanjaeger_client_*", "lanjaeger_prefill_game_*", "blocky_request_duration_seconds*"]
