# Host and container metrics of the lanjaeger server: CPU, memory, disks,
# network interfaces, Docker containers.
#
# Works in the monitoring container (HOST_* variables point at /hostfs) and
# in a Telegraf installed on the host (e.g. for VCF Operations), unchanged.

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs"]

[[inputs.diskio]]

# Physical/bonded interfaces only; Docker's virtual interfaces would double count.
[[inputs.net]]
  ignore_protocol_stats = true
  [inputs.net.tagdrop]
    interface = ["lo", "veth*", "docker*", "br-*"]

# Needs read access to /var/run/docker.sock (group of the socket).
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  label_include = ["com.docker.compose.service"]
