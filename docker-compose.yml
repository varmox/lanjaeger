# lanjaeger — a lancache stack: ad-blocking DNS, cache DNS, monolithic cache,
# log rotation, optional web UI. All settings live in .env (copy
# .env.example). Nothing in this file should need editing.
#
#   clients ──► blocky :53 ──► dns (lancache-dns) ──► UPSTREAM_DNS
#   clients ──► monolithic :80/:443 (game downloads, redirected by dns)

# Docker keeps container logs forever by default; cap them per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common: &common
  env_file: .env
  restart: ${RESTART_POLICY:-no}
  logging: *logging

services:
  # The DNS server clients use: ad/tracker blocking and DNS caching, then
  # everything goes to lancache-dns. See blocky/config.yml.
  blocky:
    image: ${BLOCKY_IMAGE:-ghcr.io/0xerr0r/blocky:v0.35.0}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${DNS_BIND_IP:?set DNS_BIND_IP in .env}:53:53/udp
      - ${DNS_BIND_IP}:53:53/tcp
    volumes:
      - ./blocky/config.yml:/app/config.yml:ro
      - ./blocky/allowlist.txt:/app/lists/allowlist.txt:ro
      - ./blocky/denylist.txt:/app/lists/denylist.txt:ro
      - ./blocky/hosts.txt:/app/lists/hosts.txt:ro
    depends_on:
      - dns

  # Answers game-CDN names with LANCACHE_IP. Only reachable through blocky.
  dns:
    <<: *common
    image: ${DNS_IMAGE:-lancachenet/lancache-dns:latest}
    healthcheck:
      # A cached domain must resolve, or clients silently bypass the cache.
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 lancache.steamcontent.com | grep -q ."]
      interval: 1m
      timeout: 5s
      start_period: 30s
      retries: 3

  monolithic:
    <<: *common
    image: ${MONOLITHIC_IMAGE:-lancachenet/monolithic:latest}
    # The image ships its own healthcheck (GET /lancache-heartbeat).
    ports:
      - ${CACHE_BIND_IP:-0.0.0.0}:80:80/tcp
      - ${CACHE_BIND_IP:-0.0.0.0}:443:443/tcp
    volumes:
      - ${CACHE_ROOT:?set CACHE_ROOT in .env}/cache:/data/cache
      - ${CACHE_ROOT}/logs:/data/logs

  # nginx writes one ever-growing access.log; the image's LOGFILE_RETENTION
  # only deletes whole files by age at container start, so it never rotates.
  # This rotates by size (copy + truncate, no nginx restart needed).
  logrotate:
    image: ${LOGROTATE_IMAGE:-busybox:1.36}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    env_file: .env
    command: ["sh", "/rotate-logs.sh"]
    volumes:
      - ${CACHE_ROOT}/logs:/logs
      - ./scripts/rotate-logs.sh:/rotate-logs.sh:ro

  # Optional web UI (dashboard + controls). Enable with COMPOSE_PROFILES=webui
  # in .env. It mounts the Docker socket — root-equivalent on this host — so
  # it's opt-in, password-protected, and meant for your LAN only.
  webui:
    profiles: [webui]
    build: ./webui
    image: lanjaeger-webui:local
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      WEBUI_PUBLIC_DASHBOARD: ${WEBUI_PUBLIC_DASHBOARD:-false}
      # The project folder is mounted at its own host path so `docker compose`
      # inside the container resolves relative paths exactly like on the host.
      PROJECT_DIR: ${PWD}
      TZ: ${TZ:-UTC}
    ports:
      - ${WEBUI_BIND_IP:-0.0.0.0}:${WEBUI_PORT:-8080}:8080
    volumes:
      - ${CACHE_ROOT}/logs:/data/logs:ro
      - ${CACHE_ROOT}/cache:/data/cache:ro
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - blocky
