# lanjaeger — a lancache stack: ad-blocking DNS, cache DNS, monolithic cache,
# log rotation, optional web UI. All settings live in .env (copy
# .env.example). Nothing in this file should need editing.
#
#   clients ──► blocky :53 ──► dns (lancache-dns) ──► UPSTREAM_DNS
#   clients ──► monolithic :80/:443 (game downloads, redirected by dns)

# Docker keeps container logs forever by default; cap them per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-common: &common
  env_file: .env
  restart: ${RESTART_POLICY:-no}
  logging: *logging

services:
  # The DNS server clients use: ad/tracker blocking and DNS caching, then
  # everything goes to lancache-dns. See blocky/config.yml.
  blocky:
    image: ${BLOCKY_IMAGE:-ghcr.io/0xerr0r/blocky:v0.35.0}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - ${DNS_BIND_IP:?set DNS_BIND_IP in .env}:53:53/udp
      - ${DNS_BIND_IP}:53:53/tcp
    volumes:
      - ./blocky/config.yml:/app/config.yml:ro
      - ./blocky/allowlist.txt:/app/lists/allowlist.txt:ro
      - ./blocky/denylist.txt:/app/lists/denylist.txt:ro
      - ./blocky/hosts.txt:/app/lists/hosts.txt:ro
    depends_on:
      - dns

  # Answers game-CDN names with LANCACHE_IP. Only reachable through blocky.
  dns:
    <<: *common
    image: ${DNS_IMAGE:-lancachenet/lancache-dns:latest}
    healthcheck:
      # A cached domain must resolve, or clients silently bypass the cache.
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 lancache.steamcontent.com | grep -q ."]
      interval: 1m
      timeout: 5s
      start_period: 30s
      retries: 3

  monolithic:
    <<: *common
    image: ${MONOLITHIC_IMAGE:-lancachenet/monolithic:latest}
    # The image ships its own healthcheck (GET /lancache-heartbeat).
    ports:
      - ${CACHE_BIND_IP:-0.0.0.0}:80:80/tcp
      - ${CACHE_BIND_IP:-0.0.0.0}:443:443/tcp
    volumes:
      - ${CACHE_ROOT:?set CACHE_ROOT in .env}/cache:/data/cache
      - ${CACHE_ROOT}/logs:/data/logs

  # nginx writes one ever-growing access.log; the image's LOGFILE_RETENTION
  # only deletes whole files by age at container start, so it never rotates.
  # This rotates by size (copy + truncate, no nginx restart needed).
  logrotate:
    image: ${LOGROTATE_IMAGE:-busybox:1.36}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    env_file: .env
    command: ["sh", "/rotate-logs.sh"]
    volumes:
      - ${CACHE_ROOT}/logs:/logs
      - ./scripts/rotate-logs.sh:/rotate-logs.sh:ro

  # Optional web UI (dashboard + controls). Enable with COMPOSE_PROFILES=webui
  # in .env. It mounts the Docker socket — root-equivalent on this host — so
  # it's opt-in, password-protected, and meant for your LAN only.
  webui:
    profiles: [webui]
    build: ./webui
    image: lanjaeger-webui:local
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    environment:
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      WEBUI_PUBLIC_DASHBOARD: ${WEBUI_PUBLIC_DASHBOARD:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The project folder is mounted at its own host path so `docker compose`
      # inside the container resolves relative paths exactly like on the host.
      PROJECT_DIR: ${PWD}
      TZ: ${TZ:-UTC}
    ports:
      - ${WEBUI_BIND_IP:-0.0.0.0}:${WEBUI_PORT:-8080}:8080
    volumes:
      - ${CACHE_ROOT}/logs:/data/logs:ro
      - ${CACHE_ROOT}/cache:/data/cache:ro
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - blocky

  # Optional monitoring (add "monitoring" to COMPOSE_PROFILES, see
  # MONITORING.md): Telegraf collects host, container and lanjaeger metrics,
  # Prometheus stores them, Grafana shows them. All three use the host
  # network — Telegraf needs the host's network counters — and Telegraf and
  # Prometheus listen on 127.0.0.1 only; Grafana is the one you open.
  telegraf:
    profiles: [monitoring]
    image: ${TELEGRAF_IMAGE:-telegraf:1.34}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    network_mode: host
    # Group of /var/run/docker.sock, for container metrics:
    #   stat -c %g /var/run/docker.sock
    user: telegraf:${DOCKER_GID:-999}
    environment:
      HOST_ETC: /hostfs/etc
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
      HOST_MOUNT_PREFIX: /hostfs
      LANJAEGER_METRICS_URL: http://${WEBUI_BIND_IP:-127.0.0.1}:${WEBUI_PORT:-8080}/metrics
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./monitoring/telegraf/telegraf.d:/etc/telegraf/telegraf.d:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    profiles: [monitoring]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.4.0}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-90d}
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: [monitoring]
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.0.0}
    restart: ${RESTART_POLICY:-no}
    logging: *logging
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: ${GRAFANA_BIND_IP:-${WEBUI_BIND_IP:-0.0.0.0}}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-${WEBUI_PASSWORD:-admin}}
      # true = anyone on the LAN can view the dashboards (e.g. on a screen)
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_PUBLIC:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/lanjaeger-dashboards/lanjaeger.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      TZ: ${TZ:-UTC}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/lanjaeger-dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
